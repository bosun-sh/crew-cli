name: CLI CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun audit
      - name: Install packaged CLI
        run: |
          npm pack
          npm install --global --prefix "$RUNNER_TEMP/crew" ./bosun-sh-crew-cli-*.tgz
          "$RUNNER_TEMP/crew/bin/crew" --version
          "$RUNNER_TEMP/crew/bin/crew" --help
